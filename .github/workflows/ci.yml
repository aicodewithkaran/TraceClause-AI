name: TraceClause AI Beta CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          ALLOW_DEMO_AUTH: "true"
          ALLOW_SYNCHRONOUS_ANALYSIS: "true"
          SECRET_KEY: "test_secret_key_minimum_32_characters_long_for_security"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_key"
        run: |
          cd backend
          python -m pytest -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build

