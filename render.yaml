services:
  # 1. FastAPI Web Service (Authentication, Validation, Job Ingestion, Health Checks)
  - type: web
    name: traceclause-api
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEMO_AUTH
        value: "false"
      - key: ALLOW_SYNCHRONOUS_ANALYSIS
        value: "false"
      - key: RUN_WORKER_IN_PROCESS
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: traceclause-redis
          property: connectionString
      - key: TRUSTED_PROXIES
        value: "10.0.0.0/8,127.0.0.1,::1"
      - key: FAIL_CLOSED_ON_REDIS_ERROR
        value: "true"

  # 2. Dedicated Supervised Background Worker (Claims jobs via FOR UPDATE SKIP LOCKED)
  - type: worker
    name: traceclause-worker
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m app.worker_daemon"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # 3. Distributed Redis (Multi-Process Atomic Sliding-Window Rate Limiter)
  - type: redis
    name: traceclause-redis
    ipAllowList: [] # internal private network only
    plan: free
